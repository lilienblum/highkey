# Piko as one Tako Compose group: every service in compose.yaml runs together, and the services
# with `x-tako` (ingest and dashboard) are Tako apps with their own routes.
#
# Set the two ClickHouse passwords as secrets for each environment:
#   tako -c tako.compose.toml secrets set PIKO_CLICKHOUSE_PASSWORD --env production
#   tako -c tako.compose.toml secrets set PIKO_INGEST_CLICKHOUSE_PASSWORD --env production
#
# compose.yaml ships development routes only. For production, give the ingest service routes for
# the ingestion paths and the tracker, and the dashboard the host:
#   ingest:     piko.example.com/api/ingest, piko.example.com/api/logs/*, piko.example.com/tracker.js
#   dashboard:  piko.example.com
name = "piko"

[compose]
file = "compose.yaml"
