name = "highkey"
runtime = "bun"
package_manager = "bun"
preset = "tanstack-start"
app_root = "apps/app/src"
main = "apps/app/dist/server/tako-entry.mjs"
assets = ["apps/app/dist/client"]
# Keep the process cwd at the repository root so channel discovery uses app_root.
dev = ["bun", "node_modules/vite/bin/vite.js", "apps/app", "--config", "apps/app/vite.config.ts"]

[build]
install = "bun install --frozen-lockfile"
run = "bun run build"
# The workflow worker loads apps/app/src/workflows/ from source, with the server code it
# imports and bunfig.toml's text loader for the dashboards guide.
include = [
  "apps/app/dist/**",
  "apps/app/src/channels/**",
  "apps/app/src/workflows/**",
  "apps/app/src/server/**",
  "apps/app/src/lib/**",
  "apps/app/package.json",
  "package.json",
  "bun.lock",
  "bunfig.toml",
]

[envs.development]
# Highkey's management state: Tako serves it from .tako/data/databases/highkey.sqlite and
# applies migrations/ to it.
databases = { main = "highkey" }

[vars.development]
HIGHKEY_PUBLIC_URL = "https://highkey.test"
SSL_CERT_FILE = ".tako/dev-ca.pem"
# Trust only the linked Tako CA: stale same-named CAs in the system keychain break verification.
NODE_USE_SYSTEM_CA = "0"
# Bun versions that ignore NODE_USE_SYSTEM_CA verify the linked CA as an extra certificate.
NODE_EXTRA_CA_CERTS = ".tako/dev-ca.pem"
HIGHKEY_INGEST_URL = "https://highkey-ingest.test"
HIGHKEY_CLICKHOUSE_URL = "http://127.0.0.1:8123"
HIGHKEY_CLICKHOUSE_PASSWORD = "highkey-dev"

[envs.test-e2e]
route = "highkey-test-e2e.test"
databases = { main = "highkey-test-e2e" }

[vars.test-e2e]
HIGHKEY_PUBLIC_URL = "https://highkey-test-e2e.test"
HIGHKEY_SIGNUP = "open"
SSL_CERT_FILE = ".tako/dev-ca.pem"
NODE_USE_SYSTEM_CA = "0"
NODE_EXTRA_CA_CERTS = ".tako/dev-ca.pem"
HIGHKEY_INGEST_URL = "https://highkey-ingest-test-e2e.test"
HIGHKEY_CLICKHOUSE_URL = "http://127.0.0.1:18124"
HIGHKEY_CLICKHOUSE_PASSWORD = "highkey-e2e"
__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS = "highkey-test-e2e.tako,highkey-test-e2e.test"
