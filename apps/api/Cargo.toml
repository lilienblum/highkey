[package]
name = "piko"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
tako = { version = "=0.2.1", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
duckdb = { version = "=1.20000.1", features = ["bundled", "json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
prost = "0.14"
flate2 = "1"
base64 = "0.22"
schemars = { version = "1", features = ["chrono04", "indexmap2"] }
indexmap = { version = "2", features = ["serde"] }
serde_path_to_error = "0.1"
rmcp = { version = "3.10", features = ["server", "macros", "transport-streamable-http-server"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
piko-sdk = { path = "../../sdk/rust" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jsonschema = { version = "0.60", default-features = false }

