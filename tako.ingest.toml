name = "highkey-ingest"
main = "target/release/highkey-ingest"
app_root = "apps/ingest"
dev = ["cargo", "run", "-p", "highkey-ingest"]
start = ["./target/release/highkey-ingest"]

# Build on Linux matching the destination server architecture and libc. The tracker bundle is
# built from sdk/typescript and served by this app at /tracker.js.
[build]
run = "cargo build --release --locked -p highkey-ingest && bun install --frozen-lockfile && bun run build:sdk"
include = ["target/release/highkey-ingest", "sdk/typescript/dist/tracker.js"]

[envs.development]
route = "highkey-ingest.test"

[vars.development]
SSL_CERT_FILE = ".tako/dev-ca.pem"
HIGHKEY_CHANGE_URL = "https://highkey.test/_highkey/changes"
HIGHKEY_CLICKHOUSE_URL = "http://127.0.0.1:8123"
HIGHKEY_INGEST_CLICKHOUSE_PASSWORD = "highkey-ingest-dev"
HIGHKEY_TRACKER_PATH = "sdk/typescript/dist/tracker.js"

[envs.test-e2e]
route = "highkey-ingest-test-e2e.test"

[vars.test-e2e]
SSL_CERT_FILE = ".tako/dev-ca.pem"
HIGHKEY_CHANGE_URL = "https://highkey-test-e2e.test/_highkey/changes"
HIGHKEY_CLICKHOUSE_URL = "http://127.0.0.1:18124"
HIGHKEY_INGEST_CLICKHOUSE_PASSWORD = "highkey-ingest-e2e"
HIGHKEY_TRACKER_PATH = "sdk/typescript/dist/tracker.js"
